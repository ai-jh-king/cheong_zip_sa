# Render Blueprint — 무료 티어 시작용 (웹 + PostgreSQL)
#
# 사용법:
#   1) 이 저장소를 GitHub에 푸시
#   2) Render 대시보드 > New + > "Blueprint" > 이 저장소 선택 > Apply
#   3) Apply 후 sync:false 인 비밀값(MOLIT_SERVICE_KEY, CORS_ORIGINS)을 웹 서비스 > Environment 에서 직접 입력
#   4) (최초 1회) 웹 서비스 > Shell 탭에서  python -m scripts.db_upgrade  실행 → DB 테이블 생성
#
# ⚠️ 무료 티어 주의:
#   - preDeployCommand(배포 전 자동 마이그레이션)는 무료에서 미지원 → 위 4번처럼 수동 1회.
#   - 무료 웹은 15분 미사용 시 슬립(첫 요청 30~60초 지연). 실사용 시작하면 starter로 업그레이드.
#   - cron(매일 자동 수집)은 보통 유료 → 아래 블록을 주석으로 둠. 당분간은 Shell에서 수동 수집:
#       python -m scripts.run_collect live
#     유료로 올릴 때 아래 cron 주석을 풀고 plan: starter 로 사용.

services:
  # ── 웹 서비스(API + 빌드된 프런트엔드를 같은 컨테이너에서 서빙) ─────────────
  - type: web
    name: cheongju-realestate
    runtime: docker
    region: singapore            # 한국에서 가장 가까운 리전(거부되면 oregon 등으로)
    plan: free                   # 무료. 출시/트래픽 시 starter($7)로 업그레이드 권장
    healthCheckPath: /health
    autoDeploy: true             # main 브랜치 푸시 시 자동 재배포
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cheongju-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # Render 가 안전한 랜덤값 자동 생성(직접 안 넣어도 됨)
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTH_DEV_LOGIN
        value: "false"           # 운영에선 반드시 false (개발용 로그인 비활성)
      - key: WEB_CONCURRENCY
        value: "1"             # 512MB(Starter)에선 워커 1개(2개면 메모리 2배 → OOM). 메모리 큰 인스턴스로 올리면 2~로.
      - key: CORS_ORIGINS
        sync: false              # 배포 후 실제 접속 도메인으로 직접 입력(예: https://내앱.onrender.com)
      - key: MOLIT_SERVICE_KEY
        sync: false              # 비밀 — 대시보드에서만 입력(절대 코드/깃에 넣지 말 것)

databases:
  # ── 관리형 PostgreSQL ───────────────────────────────────────────────────────
  - name: cheongju-db
    plan: free                   # 무료 티어(용량·보존기간 제한) → 운영은 유료(백업·PITR) 권장
    databaseName: cheongju
    region: singapore

# ── (유료 전환 시) 매일 실거래 수집 크론 — 주석 해제하고 plan: starter 로 사용 ──
