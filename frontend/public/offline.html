<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>오프라인 · 청주집사</title>
<style>
  :root{--teal:#0F766E;--ink:#1B2733;--muted:#637880;--bg:#F4F6F6;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;line-height:1.6;}
  .ico{font-size:48px;margin-bottom:10px;}
  h1{font-size:19px;font-weight:800;margin:6px 0 8px;}
  p{font-size:14px;color:var(--muted);max-width:320px;margin:0 0 22px;}
  button{border:none;background:var(--teal);color:#fff;font-weight:800;font-size:15px;
          padding:13px 28px;border-radius:12px;cursor:pointer;}
  button:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;}
  .hint{font-size:12px;color:var(--muted);margin-top:18px;}
</style>
</head>
<body>
  <div class="ico">📶</div>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>청주집사는 실거래·시세 데이터를 인터넷에서 불러옵니다. 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
  <div class="hint">자료: 국토교통부 실거래가 · 한국부동산원</div>
</body>
</html>
