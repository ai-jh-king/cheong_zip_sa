# Render Blueprint — 웹 + PostgreSQL + 매일 자동 수집(크론)
#
# 사용법:
#   1) 이 저장소를 GitHub에 푸시
#   2) Render 대시보드 > New + > "Blueprint" > 이 저장소 선택 > Apply
#   3) Apply 후 sync:false 인 비밀값(MOLIT_SERVICE_KEY, CORS_ORIGINS, KAKAO_REST_API_KEY)을 각 서비스 > Environment 에서 직접 입력
#   4) 배포 후 웹 서비스 > Shell:  python -m scripts.db_upgrade  (마이그레이션, 현재 head 0019)
#
# ⚠️ 이미 대시보드에서 수동으로 서비스를 만든 경우(Blueprint 미사용):
#   이 파일을 Apply 하지 말고, OPERATIONS.md "3.1 데이터 자동 갱신"의
#   [대시보드에서 Cron Job 만들기] 절차를 따르세요(중복 서비스 생성 방지).

services:
  # ── 웹 서비스(API + 빌드된 프런트엔드를 같은 컨테이너에서 서빙) ─────────────
  - type: web
    name: cheongju-realestate
    runtime: docker
    region: singapore            # 한국에서 가장 가까운 리전(거부되면 oregon 등으로)
    plan: starter                # 운영 중(슬립 없음). 초기 실험만이면 free 로 낮춰도 됨
    healthCheckPath: /health
    autoDeploy: true             # main 브랜치 푸시 시 자동 재배포
    # 매 배포 직전(새 버전 라이브 전) 자동 마이그레이션 — alembic upgrade 는 멱등(이미 head면 무동작)이라 안전.
    # PG는 init_db 가 create_all 을 안 하므로 스키마 권위 소스는 Alembic. 이 한 줄로 수동 db_upgrade 스텝 제거.
    # (Starter 이상 유료 인스턴스에서 동작. Blueprint 미사용 시 대시보드 Settings > Pre-Deploy Command 에 동일 입력.)
    preDeployCommand: python -m scripts.db_upgrade
    envVars:
      - key: APP_ENV
        value: production        # 프로덕션 안전가드 활성화(JWT_SECRET/AUTH_DEV_LOGIN 미설정 시 부팅 거부). 미설정이면 가드 전부 무력.
      - key: DATABASE_URL
        fromDatabase:
          name: cheongju-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # Render 가 안전한 랜덤값 자동 생성(직접 안 넣어도 됨)
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTH_DEV_LOGIN
        value: "false"           # 운영에선 반드시 false (개발용 로그인 비활성)
      - key: WEB_CONCURRENCY
        value: "1"             # 512MB(Starter)에선 워커 1개(2개면 메모리 2배 → OOM). 메모리 큰 인스턴스로 올리면 2~로.
      - key: CORS_ORIGINS
        sync: false              # 배포 후 실제 접속 도메인으로 직접 입력(예: https://내앱.onrender.com)
      - key: MOLIT_SERVICE_KEY
        sync: false              # 비밀 — 대시보드에서만 입력(절대 코드/깃에 넣지 말 것)

  # ── 매일 자동 수집·지오코딩 크론(한국시간 04:00) ────────────────────────────
  #    scheduler --once = 실거래 수집 + 단지·시설 지오코딩 1사이클 후 종료(JobRun 기록·경보 포함)
  - type: cron
    name: cheongju-collect
    runtime: docker
    region: singapore
    plan: starter
    schedule: "0 19 * * *"       # 19:00 UTC = 한국시간 04:00 (MOLIT 갱신 후 새벽 수집)
    dockerCommand: python -m scripts.scheduler --once
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cheongju-db
          property: connectionString
      - key: MOLIT_SERVICE_KEY
        sync: false              # 웹 서비스와 동일 키를 여기에도 입력
      - key: KAKAO_REST_API_KEY
        sync: false              # (선택) 지오코딩용 — 없으면 지오코딩만 건너뜀(수집은 정상)
      - key: BACKUP_DIR
        value: /var/backups/cheongju   # 영구 디스크(아래) — 기본값(상대경로)은 컨테이너 임시FS라 재시작 시 유실(실사고)
    disk:
      name: cheongju-backups
      mountPath: /var/backups/cheongju
      sizeGB: 1

databases:
  # ── 관리형 PostgreSQL ───────────────────────────────────────────────────────
  # ⚠️ 실사고(2026-07): free 플랜 DB가 만료되어 운영 데이터 전량 유실.
  #    무료 티어는 생성 후 일정 기간이 지나면 자동 만료(복구 불가)되므로 운영은 반드시 유료 플랜.
  #    DB 교체 후 복구는 `python -m scripts.bootstrap` 1회(마이그레이션→시드→수집→지오코딩→스냅샷).
  - name: cheongju-db
    plan: basic-256mb            # 운영 필수(무료는 만료 시 삭제 — 실사고). 백업·PITR 포함 플랜 권장
    databaseName: cheongju
    region: singapore
