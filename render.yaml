# Render Blueprint — 한 번의 연결로 [웹 + PostgreSQL + 매일 수집 크론]을 함께 배포.
#
# 사용법:
#   1) 이 저장소를 GitHub에 푸시
#   2) Render 대시보드 > New + > "Blueprint" > 이 저장소 선택 > Apply
#   3) Apply 후 sync:false 인 비밀값(MOLIT_SERVICE_KEY, CORS_ORIGINS)을 각 서비스 > Environment 에서 직접 입력
#
# ⚠️ 주의: plan/region 이름과 무료 한도는 Render 정책에 따라 바뀔 수 있습니다.
#    Blueprint Apply 시 값이 거부되면 대시보드 안내에 맞춰 plan(free/starter 등)·region 을 조정하세요.
#    무료로만 시작하려면 cron 블록을 잠시 빼고(크론은 보통 유료), 수집은 수동으로 돌려도 됩니다.

services:
  # ── 웹 서비스(API + 빌드된 프런트엔드를 같은 컨테이너에서 서빙) ─────────────
  - type: web
    name: cheongju-realestate
    runtime: docker
    region: singapore            # 한국에서 가장 가까운 리전(거부되면 oregon 등으로)
    plan: free                   # 무료는 15분 미사용 시 슬립 → 출시/트래픽 시 starter($7)로 업그레이드 권장
    healthCheckPath: /health
    autoDeploy: true             # main 브랜치 푸시 시 자동 재배포
    preDeployCommand: python -m scripts.db_upgrade   # 새 버전 가동 전 DB 마이그레이션 자동 실행(head 0016)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cheongju-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # Render 가 안전한 랜덤값 자동 생성(직접 안 넣어도 됨)
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTH_DEV_LOGIN
        value: "false"           # 운영에선 반드시 false (개발용 로그인 비활성)
      - key: WEB_CONCURRENCY
        value: "2"
      - key: CORS_ORIGINS
        sync: false              # 배포 후 실제 접속 도메인으로 직접 입력(예: https://내도메인)
      - key: MOLIT_SERVICE_KEY
        sync: false              # 비밀 — 대시보드에서만 입력(절대 코드/깃에 넣지 말 것)

  # ── 매일 실거래 수집 크론(신규분만 증분 수집) ───────────────────────────────
  - type: cron
    name: cheongju-collect
    runtime: docker
    region: singapore
    plan: starter                # 크론 잡은 보통 유료. 무료로 시작하려면 이 블록 제거 후 수동 수집
    schedule: "0 19 * * *"       # 매일 19:00 UTC = 한국시간 04:00 (새벽 자동 수집)
    dockerCommand: python -m scripts.run_collect live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cheongju-db
          property: connectionString
      - key: MOLIT_SERVICE_KEY
        sync: false

databases:
  # ── 관리형 PostgreSQL ───────────────────────────────────────────────────────
  - name: cheongju-db
    plan: free                   # 무료 티어(용량·보존기간 제한) → 운영은 유료(백업·PITR) 권장
    databaseName: cheongju
    region: singapore
