<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 접근성(WCAG 1.4.4): 저시력 확대 허용 — maximum-scale/user-scalable 금지 제거 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>청집사 — 청주 부동산</title>
<!-- 폰트: 렌더 블로킹 제거(preconnect + 비동기 스왑, 폴백 system-ui 선페인트) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" /></noscript>
<!-- PWA (Phase B) -->
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0F766E" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="청집사" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root{--up:#DB342B;--down:#2563D8;--ink:#16212C;--muted:#69737D;--teal:#0E7C71;--line:rgba(20,32,43,.09);
    --bg1:#F4F6F9;--bg2:#F4F6F9;--bg3:#F4F6F9;
    --surface:#ffffff;--surface-solid:#ffffff;--surface-2:#F0F3F6;--card-border:rgba(20,32,43,.08);
    --row:rgba(20,32,43,.025);--hd:rgba(20,32,43,.025);--chip:#EDF1F4;--callout-bg:#FFF6DC;--callout-fg:#7a5b00;
    /* 상태 시맨틱 토큰(감사 H4: 밝은 하드코딩 배경이 다크에서 붕 뜨던 것) */
    --ok-bg:#E4F2E8;--ok-fg:#1d6b3a;--info-bg:#E7EEF6;--info-fg:#1E5FC4;--warn-fg:#9A6B00;--neutral-bg:#EEF1F1;}
  [data-theme=dark]{--up:#FF6F62;--down:#76ABFF;--ink:#E7EDF2;--muted:#9DAAB4;--teal:#37B9A8;--line:rgba(150,170,185,.16);
    --bg1:#0F1419;--bg2:#0F1419;--bg3:#0F1419;
    --surface:#171F27;--surface-solid:#171F27;--surface-2:#1E2730;--card-border:rgba(255,255,255,.07);
    --row:rgba(255,255,255,.04);--hd:rgba(255,255,255,.03);--chip:rgba(255,255,255,.06);--callout-bg:rgba(255,205,90,.12);--callout-fg:#E8C766;
    --ok-bg:rgba(72,180,110,.16);--ok-fg:#6FCF97;--info-bg:rgba(96,150,240,.16);--info-fg:#76ABFF;--warn-fg:#E0A94E;--neutral-bg:rgba(255,255,255,.08);}
  /* 게시판 카테고리 칩 — hex+알파 인라인이던 것을 테마 클래스로(다크 저대비 해소) */
  .cat-free{background:rgba(15,118,110,.12);color:#0F766E}.cat-qa{background:rgba(30,95,196,.12);color:#1E5FC4}
  .cat-info{background:rgba(122,90,248,.12);color:#7A5AF8}.cat-deal{background:rgba(200,50,42,.12);color:#C8322A}
  .cat-local{background:rgba(14,116,144,.12);color:#0E7490}
  [data-theme=dark] .cat-free{color:#37B9A8}[data-theme=dark] .cat-qa{color:#76ABFF}
  [data-theme=dark] .cat-info{color:#A78BFA}[data-theme=dark] .cat-deal{color:#FF6F62}
  [data-theme=dark] .cat-local{color:#4FC3DD}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;} html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{overscroll-behavior:none;}  /* 당겨서 새로고침·바운스 제거(앱 느낌) */
  body{margin:0;color:var(--ink);font-family:Pretendard,system-ui,-apple-system,sans-serif;min-height:100vh;background:var(--bg1);}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px 96px;}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--card-border);border-radius:18px;box-shadow:0 1px 2px rgba(16,24,32,.04),0 6px 18px rgba(16,24,32,.05);}
  .feedrow{border-bottom:1px solid var(--line);transition:background .12s;}
  .feedrow:active{background:var(--row);}
  .sectit{font-weight:800;font-size:15px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .ex{background:rgba(225,120,40,.14);color:#A85420;}
  .sel{padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);min-height:42px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);width:100%;min-width:0;}
  /* 커스텀 드롭다운 — 네이티브 select 리스트('붕뜬' 회색 OS 리스트) 대신 앱 테마 패널(body 포털+뷰포트 클램프). */
  .dd-btn{display:flex;align-items:center;gap:6px;width:100%;min-width:0;min-height:42px;padding:9px 12px;border-radius:11px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;}
  .dd-btn:disabled{opacity:.5;cursor:default;}
  .dd-btn .dd-lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dd-btn .dd-lbl.ph{color:var(--muted);font-weight:500;}
  .dd-btn .dd-chev{flex:none;color:var(--muted);font-size:10px;transition:transform .16s ease;}
  .dd-btn.open .dd-chev{transform:rotate(180deg);}
  .dd-backdrop{position:fixed;inset:0;z-index:2500;}
  .dd-menu{position:fixed;z-index:2600;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 12px 34px rgba(16,24,32,.24);padding:6px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:ddin .14s ease;}
  @keyframes ddin{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .dd-opt{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;}
  .dd-opt:hover,.dd-opt:focus-visible{background:var(--surface-2);outline:none;}
  .dd-opt.on{color:var(--teal);font-weight:800;}
  .dd-opt .dd-check{margin-left:auto;color:var(--teal);font-weight:900;}
  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}
  .pager{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 0 2px;}
  .pgbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;}
  .pgbtn:disabled{color:#AEB7BB;background:rgba(244,246,246,.55);cursor:default;}
  .pgnum{font-size:13px;color:var(--muted);font-weight:600;min-width:62px;text-align:center;}
  .inp{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font:inherit;font-size:15px;color:var(--ink);width:100%;}
  .tog{border:none;background:var(--surface-2);color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:38px;}
  .tog.on{background:var(--surface-solid);color:var(--ink);font-weight:800;box-shadow:0 1px 3px rgba(30,64,90,.14);}
  .btn-primary{border:none;background:var(--teal);color:#fff;font:inherit;font-weight:800;font-size:14px;padding:12px 16px;border-radius:12px;cursor:pointer;transition:transform .06s ease,filter .12s ease;}
  .btn-primary:active{transform:scale(.985);filter:brightness(.94);}
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .btn-ghost{border:none;background:var(--surface-2);color:var(--teal);font:inherit;font-weight:800;font-size:13px;padding:9px 15px;border-radius:11px;cursor:pointer;}
  /* 차분한 아웃라인 CTA — 솔리드 대신 테두리+teal글자(매물 등록 등 보조 액션용). */
  .btn-outline{border:1.5px solid var(--teal);background:transparent;color:var(--teal);font:inherit;font-weight:800;font-size:14px;padding:11px 16px;border-radius:12px;cursor:pointer;transition:background .12s ease;}
  .btn-outline:active{background:rgba(15,118,110,.09);}
  .btn-outline:disabled{opacity:.5;cursor:default;}
  :focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:7px;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}
  table{width:100%;border-collapse:collapse;} th,td{text-align:left;padding:10px 7px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{color:var(--muted);font-weight:600;font-size:12px;background:var(--hd);} tr:hover td{background:var(--row);}
  .rankno{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted);flex:none;}
  .rankno.top{background:var(--teal);color:#fff;}
  .listrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .listrow:last-child{border-bottom:none;}
  .statusdot{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;flex:none;}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,32,.05);z-index:50;}
  .nav-inner{max-width:480px;margin:0 auto;display:flex;}
  .nav-btn{flex:1;border:none;background:none;font:inherit;padding:11px 0 14px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;min-width:0;min-height:60px;}
  .nav-btn.on{color:var(--teal);}
  @media(max-width:720px){.hide-sm{display:none;}.filters{grid-template-columns:1fr 1fr;}}
  @media(max-width:380px){.nav-btn{font-size:10px;}}

  /* --- 추가 UX 유틸 --- */
  .skel{position:relative;overflow:hidden;background:var(--row);border-radius:8px;}
  .skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 1.25s ease-in-out infinite;}
  [data-theme=dark] .skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}
  @keyframes shimmer{100%{transform:translateX(100%);}}
  @media(prefers-reduced-motion:reduce){
    .skel::after{animation:none;}
    .skel{animation:skelpulse 1.4s ease-in-out infinite;}
    @keyframes skelpulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  }
  .sticky-filter{position:sticky;top:0;z-index:20;}
  .collapse-body{animation:expand .22s ease;}
  @keyframes expand{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .tip{position:relative;display:inline-flex;align-items:center;cursor:help;}
  .tip>.tipdot{width:14px;height:14px;border-radius:50%;background:var(--line);color:var(--muted);font-size:10px;
    font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;}
  .tip>.tiptext{visibility:hidden;opacity:0;position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--surface-solid);font-size:11.5px;font-weight:500;line-height:1.5;
    padding:7px 10px;border-radius:8px;width:max-content;max-width:230px;white-space:normal;z-index:60;
    box-shadow:0 6px 18px rgba(0,0,0,.18);transition:opacity .15s;}
  .tip:hover>.tiptext,.tip:active>.tiptext{visibility:visible;opacity:1;}
  /* 포털(body)로 띄우는 툴팁 — 위치는 JS가 뷰포트에 맞춰 인라인으로 지정(화면 밖 잘림 방지). */
  .tiptext-fx{background:var(--ink);color:var(--surface-solid);font-size:11.5px;font-weight:500;line-height:1.5;
    padding:8px 11px;border-radius:8px;white-space:normal;z-index:3000;box-shadow:0 6px 20px rgba(0,0,0,.24);
    pointer-events:none;animation:tipfade .12s ease;}
  /* 토스트 — alert() 대체(모바일 UX·테마 대응). JS toast()가 생성/제거. */
  .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:var(--surface-solid);font-size:13px;font-weight:600;line-height:1.5;
    padding:11px 16px;border-radius:12px;z-index:4000;box-shadow:0 8px 24px rgba(0,0,0,.28);
    max-width:min(92vw,420px);text-align:center;pointer-events:none;animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .toast.out{opacity:0;transition:opacity .25s ease;}
  @keyframes tipfade{from{opacity:0;}to{opacity:1;}}
  .txrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer;}
  .txrow:last-child{border-bottom:none;} .txrow:hover{background:var(--row);}
  .sparkwrap{display:flex;align-items:flex-end;gap:2px;height:30px;}
  .themebtn{border:none;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;width:34px;height:34px;
    font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<!-- 프리스플래시: JS 번들 다운로드/파싱 동안 흰 화면 대신 즉시 브랜드 페인트(React 마운트 시 교체됨).
     모티브 = 집 + 직지 활자판(앱 아이콘과 동일, 청주 상징 퓨전) -->
<!-- ⚠️ 아래 마크업은 React <Splash/>와 픽셀 단위로 동일해야 함(크기·간격·폰트).
     다르면 JS 마운트 순간 요소가 '튀며' 두 화면이 순차로 보이는 현상 발생(실사고 v1.219 교정). -->
<div id="root"><div style="position:fixed;inset:0;background:linear-gradient(160deg,#1FA594 0%,#0E7C71 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
<div style="width:104px;height:104px;border-radius:26px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.18)">
<svg width="64" height="64" viewBox="0 0 100 100" fill="none" aria-hidden="true">
 <path d="M14 46 50 18 86 46" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="24" y="50" width="52" height="34" rx="5" stroke="#fff" stroke-width="6"/>
 <rect x="31" y="57" width="10" height="9" rx="2" fill="#fff"/>
 <rect x="45" y="57" width="10" height="9" rx="2" fill="#FFD678"/>
 <rect x="59" y="57" width="10" height="9" rx="2" fill="#fff"/>
 <rect x="31" y="70" width="10" height="9" rx="2" fill="#fff"/>
 <rect x="45" y="70" width="10" height="9" rx="2" fill="#fff"/>
 <rect x="59" y="70" width="10" height="9" rx="2" fill="#fff"/>
</svg>
</div>
<div style="color:#fff;font-weight:800;font-size:30px;letter-spacing:-0.02em;margin-top:4px">청집사</div>
<div style="color:rgba(255,255,255,.9);font-size:14px;font-weight:600">직지의 도시 청주, 집을 기록하다</div>
</div></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  /* 설치형 PWA용 서비스워커 등록(로드 시). 푸시 코드의 register('/sw.js')와 멱등. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
